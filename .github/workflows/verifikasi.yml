# Empat perintah verifikasi dari CLAUDE.md bagian 7, dijalankan pada setiap push.
#
# Perintah keempat (`VISION_ENABLED=false npm test`) bukan formalitas. Ia adalah
# bukti tunggal untuk klaim arsitektural terpenting proyek ini: model penglihatan
# bisa dicabut tanpa mematikan sistem. Kalau langkah itu merah, pekerjaan yang
# menyebabkannya dianggap gagal, bukan sekadar perlu perbaikan kecil.

name: Verifikasi

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verifikasi:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` di package.json menjalankan `prisma generate`, jadi client
      # Prisma sudah ada sebelum typecheck. Client itu tidak di-commit — ia
      # hasil generate dari schema.prisma, dan menyimpannya di repo berarti dua
      # sumber kebenaran yang bisa berbeda diam-diam.
      - name: Pasang dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Periksa format
        run: npm run format:cek

      - name: Typecheck
        run: npm run typecheck

      - name: Tes
        run: npm test

      # Langkah ini adalah bukti tunggal untuk klaim arsitektural terpenting
      # proyek ini: model penglihatan bisa dicabut tanpa mematikan sistem.
      # Kalau ia merah, klaim itu bohong — perlakukan sebagai kegagalan tugas,
      # bukan sebagai tes yang perlu diperbaiki.
      #
      # `VISION_API_KEY` sengaja TIDAK diisi. Kalau langkah ini lulus tanpa
      # kunci API sama sekali, tidak ada jalur tersembunyi yang diam-diam
      # memanggil model.
      - name: Tes tanpa model penglihatan (bukti isolasi model)
        run: npm test
        env:
          VISION_ENABLED: "false"

      - name: Build
        run: npm run build
        env:
          # Build tidak menyentuh basis data — tidak ada kueri yang dijalankan
          # saat build. Nilai ini hanya ada supaya konstruksi client tidak gagal
          # pada pemeriksaan "DATABASE_URL belum diisi" di /src/lib/db.ts.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          VISION_ENABLED: "false"
